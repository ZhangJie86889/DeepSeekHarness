# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# ── user plugins ─────────────────────────────────────────────────────────────

# Chat-area background image plugin (browser half injects the styles; the
# image itself is served from the frontend dist as /chat-background.png).
- insert:
    - id: chat-background
      name: 'dsh-client-chat-background'

# Agent-scoped durable reminders/schedules (after / at / every) over the
# session event log.
- insert:
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

# ── MCP client (kept DISABLED until a real server is configured) ──────────────
